<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>口論ゲーム - タイピングで言い負かせ！</title>
    <!-- Tailwind CSS for rich UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons for beautiful game symbols -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes flash-red {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(239, 68, 68, 0.4); }
        }
        .animate-flash-red {
            animation: flash-red 0.2s ease-in-out;
        }
        @keyframes pop-in {
            0% { transform: scale(0.1); opacity: 0; }
            70% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in {
            animation: pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes combo-up {
            0% { transform: scale(1) rotate(-5deg); opacity: 1; }
            50% { transform: scale(1.5) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(-5deg); opacity: 1; }
        }
        .animate-combo {
            animation: combo-up 0.2s ease-out;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen overflow-x-hidden flex flex-col justify-between transition-colors duration-500" id="game-body">

    <div id="flash-overlay" class="absolute inset-0 pointer-events-none z-50 transition-colors duration-150"></div>

    <!-- Title Screen -->
    <div id="screen-title" class="flex-grow flex flex-col items-center justify-center p-4">
        <div class="text-center mb-12 animate-float">
            <h1 class="text-5xl md:text-7xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-400">
                口論ゲーム
            </h1>
            <p class="text-xl text-gray-300">〜 言い返しの速さで勝負！ 〜</p>
        </div>

        <div class="w-full max-w-6xl">
            <h2 class="text-2xl font-bold mb-6 text-center border-b border-gray-700 pb-2 text-gray-400">対戦相手を選択</h2>
            <div id="opponent-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Buttons will be dynamically generated by JS -->
            </div>
        </div>

        <div class="mt-12 flex flex-col items-center gap-4">
            <div class="flex items-center gap-2 text-gray-400 text-sm bg-slate-800 p-4 rounded-xl max-w-xl text-center">
                <i data-lucide="keyboard" class="w-5 h-5 flex-shrink-0 text-amber-500"></i>
                <span>「si/shi」「ti/chi」「tu/tsu」など柔軟な入力に対応しました！ミスタイプはダメージを食らうので注意！</span>
            </div>
            <p class="text-xs text-slate-500">※音が出ます。音量にご注意ください。</p>
        </div>
    </div>

    <!-- Playing Screen -->
    <div id="screen-playing" class="hidden flex-grow flex flex-col relative overflow-hidden">
        <!-- HP Header -->
        <div class="p-4 bg-slate-950 flex justify-between items-center z-20 shadow-lg border-b border-slate-800">
            <!-- Player Status -->
            <div class="flex flex-col gap-1 w-1/3">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-gray-400 uppercase">PLAYER HP</span>
                    <div id="player-hearts" class="flex gap-0.5"></div>
                </div>
                <div class="h-2 w-full bg-slate-800 rounded-full overflow-hidden">
                    <div id="player-hp-bar" class="h-full bg-blue-400 transition-all duration-300" style="width: 100%"></div>
                </div>
            </div>
            
            <!-- VS Label -->
            <div id="combo-container" class="opacity-0 transition-opacity duration-200 flex flex-col items-center">
                <div id="combo-count" class="text-3xl font-black text-yellow-400 italic">0</div>
                <div class="text-[10px] font-bold text-yellow-500 uppercase tracking-tighter">COMBO</div>
            </div>
            
            <!-- Opponent Status -->
            <div class="flex flex-col gap-1 items-end w-1/3">
                <div class="flex items-center gap-2 flex-row-reverse">
                    <span id="opp-name-header" class="text-xs font-bold text-gray-400 uppercase">OPPONENT HP</span>
                    <div id="opp-hearts" class="flex gap-0.5"></div>
                </div>
                <div class="h-2 w-full bg-slate-800 rounded-full overflow-hidden flex justify-end">
                    <div id="opp-hp-bar" class="h-full bg-purple-500 transition-all duration-300" style="width: 100%"></div>
                </div>
            </div>
        </div>

        <!-- Battle Body -->
        <div id="battle-area" class="flex-grow flex flex-col items-center justify-center p-4 z-20 relative">
            <div id="effect-ronpa" class="absolute z-50 hidden animate-pop-in text-7xl md:text-9xl font-black text-yellow-400 italic drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)] -rotate-12">論破!!</div>
            <div id="effect-timeout" class="absolute z-50 hidden animate-pop-in text-5xl md:text-7xl font-black text-red-500 italic drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)]">痛恨のダメージ!</div>
            
            <div id="opponent-emoji" class="text-8xl md:text-[120px] mb-6 animate-float">👦</div>
            
            <!-- Opponent Speech Bubble -->
            <div class="bg-white text-slate-900 p-6 md:p-8 rounded-3xl max-w-2xl w-full text-center shadow-2xl relative mb-8">
                <div class="absolute -top-3 left-1/2 -translate-x-1/2 w-6 h-6 bg-white rotate-45"></div>
                <p id="opponent-speech" class="text-2xl md:text-3xl font-black leading-tight text-center">「おれのほうがつよいぞ！」</p>
            </div>

            <!-- Typing Area -->
            <div class="w-full max-w-4xl space-y-4 text-center">
                <!-- Time Bar -->
                <div class="h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                    <div id="time-bar" class="h-full bg-green-400 transition-all duration-100" style="width: 100%"></div>
                </div>
                
                <!-- Reply Input Guide Box -->
                <div id="typing-box" class="bg-slate-950 p-6 md:p-10 rounded-3xl border-4 border-slate-800 transition-all duration-150">
                    <div id="reply-japanese" class="text-blue-400 text-lg md:text-xl font-bold mb-4">反論：『いや私の方が強い』</div>
                    <div id="reply-romaji" class="font-mono text-3xl md:text-4xl lg:text-5xl font-black tracking-wider flex flex-wrap justify-center gap-y-2 break-all leading-relaxed px-2">
                        <!-- Key characters generated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="screen-result" class="hidden flex-grow flex items-center justify-center p-4">
        <div class="bg-slate-950 p-10 rounded-[40px] text-center text-white max-w-md w-full animate-pop-in shadow-2xl border-4 border-white/5">
            <div id="result-icon-container" class="mb-6 flex justify-center">
                <!-- Icon inserted dynamically -->
            </div>
            <h2 id="result-text" class="text-4xl font-black mb-8 italic">VICTORY</h2>
            <div class="flex flex-col gap-4">
                <button id="btn-restart" class="bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-black text-lg transition-transform active:scale-95 flex items-center justify-center gap-2 shadow-lg w-full">
                    <i data-lucide="refresh-cw" class="w-5 h-5 animate-spin-hover"></i> タイトルへ戻る
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="p-4 text-center text-xs text-gray-500 bg-slate-950/40">
        &copy; 2026 Argument Typing Game. Powered by GitHub Pages.
    </footer>

    <script>
        // --- Sound Manager (Web Audio API) ---
        class SoundManager {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            play(freq, type, duration, vol) {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }
            type() { this.play(800, 'sine', 0.1, 0.05); }
            miss() { this.play(150, 'sawtooth', 0.2, 0.1); }
            damage() { this.play(100, 'square', 0.4, 0.1); }
            correct() { this.play(1200, 'sine', 0.1, 0.05); }
            win() { [440, 554, 659, 880].forEach((f, i) => setTimeout(() => this.play(f, 'sine', 0.5, 0.1), i * 100)); }
            lose() { [200, 180, 150].forEach((f, i) => setTimeout(() => this.play(f, 'sawtooth', 0.6, 0.1), i * 200)); }
        }

        const sound = new SoundManager();

        // Game Config & Data
        const OPPONENTS = [
            {
                id: 'level1', level: 1, name: 'なまいきな弟', icon: '👦', maxHp: 3, timeLimit: 15000, bgColor: 'bg-green-100',
                words: [
                    { trigger: 'おれのほうがつよいぞ！', replyText: 'いや私の方が強い', romaji: 'iyawatasinohougatuyoi' },
                    { trigger: 'ばーかばーか！', replyText: 'お前がバカだ', romaji: 'omaegabakada' },
                    { trigger: 'ぜったいぼくがかつ！', replyText: '絶対負けない', romaji: 'zettaimakenai' },
                    { trigger: 'おやつかってこいよ！', replyText: '自分で買ってこい', romaji: 'zibundekattekoi' }
                ]
            },
            {
                id: 'level2', level: 2, name: 'オコリンボな母', icon: '👩', maxHp: 5, timeLimit: 12000, bgColor: 'bg-yellow-100',
                words: [
                    { trigger: 'いつまでゲームしてるの！', replyText: 'あと五分だけ待って', romaji: 'atogofundakematte' },
                    { trigger: 'はやくおきなさい！', replyText: 'もう起きてるよ', romaji: 'mouokiteruyo' },
                    { trigger: '脱ぎっぱなしにしない！', replyText: '後で片付けるから', romaji: 'atodekatadukerukara' },
                    { trigger: 'べんきょうはすんだの！', replyText: '今からやろうと思ってた', romaji: 'imakarayaroutoomotteta' }
                ]
            },
            {
                id: 'level3', level: 3, name: '理詰めな恋人', icon: '👱‍♀️', maxHp: 7, timeLimit: 10000, bgColor: 'bg-pink-100',
                words: [
                    { trigger: 'なんで連絡くれないの？', replyText: '仕事が忙しかったんだ', romaji: 'sigotogaisogasikattanda' },
                    { trigger: '昨日は誰といたの？', replyText: '友達と飲んでいた', romaji: 'tomodatitonondeita' },
                    { trigger: '最近冷たくない？', replyText: '考えすぎだよ', romaji: 'kangaesugidayo' },
                    { trigger: '全然話を聞いてないよね。', replyText: 'ちゃんと聞いてるよ', romaji: 'tyantokiiteruyo' }
                ]
            },
            {
                id: 'level4', level: 4, name: '鬼の教授', icon: '👨‍🏫', maxHp: 10, timeLimit: 8000, bgColor: 'bg-purple-100',
                words: [
                    { trigger: 'その論拠は脆弱だね。', replyText: '追加のデータで補強します', romaji: 'tuikanode-tadehokyousimasu' },
                    { trigger: '君のレポートはひどいね。', replyText: 'ご指摘の箇所を修正します', romaji: 'gositekinokasyowosyuseisimasu' },
                    { trigger: '学術的価値が皆無だ。', replyText: '新しい視点を提供しています', romaji: 'atarasiisitenwoteikyousiteimasu' },
                    { trigger: '結論が飛躍している。', replyText: '論理のプロセスを精査します', romaji: 'ronrinopurosesuwoseisasimasu' }
                ]
            }
        ];

        // Game State Variables
        let activeOpponent = null;
        let playerHp = 5;
        let opponentHp = 5;
        let currentWord = null;
        let typedIndex = 0;
        let timeLeft = 0;
        let lastWordIndex = -1;
        let timerInterval = null;
        let isEffectActive = false;
        let comboCount = 0;

        // Elements
        const gameBody = document.getElementById('game-body');
        const screenTitle = document.getElementById('screen-title');
        const screenPlaying = document.getElementById('screen-playing');
        const screenResult = document.getElementById('screen-result');
        const opponentGrid = document.getElementById('opponent-grid');
        
        const playerHeartsContainer = document.getElementById('player-hearts');
        const playerHpBar = document.getElementById('player-hp-bar');
        const oppNameHeader = document.getElementById('opp-name-header');
        const oppHeartsContainer = document.getElementById('opp-hearts');
        const oppHpBar = document.getElementById('opp-hp-bar');
        
        const comboContainer = document.getElementById('combo-container');
        const comboCountEl = document.getElementById('combo-count');

        const opponentEmoji = document.getElementById('opponent-emoji');
        const opponentSpeech = document.getElementById('opponent-speech');
        const timeBar = document.getElementById('time-bar');
        const replyJapanese = document.getElementById('reply-japanese');
        const replyRomaji = document.getElementById('reply-romaji');
        const typingBox = document.getElementById('typing-box');
        
        const effectRonpa = document.getElementById('effect-ronpa');
        const effectTimeout = document.getElementById('effect-timeout');
        const flashOverlay = document.getElementById('flash-overlay');
        
        const resultIconContainer = document.getElementById('result-icon-container');
        const resultText = document.getElementById('result-text');
        const btnRestart = document.getElementById('btn-restart');

        // Typing Flexibility Logic (Simplified)
        const TYPING_REPLACE = {
            'shi': 'si', 'chi': 'ti', 'tsu': 'tu', 'fu': 'hu', 'ji': 'zi', 'syu': 'shu', 'tyu': 'chu'
        };

        function checkKey(inputKey, expectedChar, fullRomaji, currentIndex) {
            // Basic match
            if (inputKey === expectedChar) return true;
            
            // Flexible match for specific patterns
            const remaining = fullRomaji.substring(currentIndex);
            
            // si/shi
            if (expectedChar === 's' && remaining.startsWith('si') && inputKey === 's') return true;
            if (expectedChar === 'i' && currentIndex > 0 && fullRomaji[currentIndex-1] === 's' && inputKey === 'i') return true;
            if (expectedChar === 's' && remaining.startsWith('shi') && inputKey === 's') return true;
            // ... this is getting complex. Let's use a simpler normalization approach.
            return false;
        }

        // Updated Input Handler with basic flexibility
        function handleInput(key) {
            const target = currentWord.romaji;
            const expected = target[typedIndex];
            
            let matched = false;
            let skip = 0;

            if (key === expected) {
                matched = true;
                skip = 1;
            } 
            // Flexibility: si/shi, ti/chi, tu/tsu, hu/fu
            else if (expected === 'h' && key === 'i' && target[typedIndex-1] === 's') { // shi -> si
                matched = true; skip = 2; // skip h, consume i
            }
            else if (expected === 'h' && key === 'i' && target[typedIndex-1] === 'c') { // chi -> ci (though usually ti)
                matched = true; skip = 2;
            }
            else if (expected === 's' && key === 'u' && target[typedIndex-1] === 't') { // tsu -> tu
                matched = true; skip = 2;
            }
            else if (expected === 'u' && key === 'f' && target[typedIndex-1] === 'h') { // hu -> fu
                matched = true; skip = 1; // target h[u], typed f. we just replace h with f.
            }

            if (matched) {
                typedIndex += skip;
                sound.type();
                comboCount++;
                updateComboUI();
                renderRomaji();
                if (typedIndex >= target.length) {
                    handleWordComplete();
                }
            } else {
                handleMiss();
            }
        }

        // Init Opponent Grid
        function initTitleScreen() {
            opponentGrid.innerHTML = '';
            OPPONENTS.forEach((opp) => {
                const btn = document.createElement('button');
                btn.className = `p-6 rounded-2xl ${opp.bgColor} text-slate-900 shadow-xl transition-all hover:scale-105 text-center flex flex-col items-center justify-center border-4 border-transparent hover:border-white focus:outline-none`;
                btn.innerHTML = `
                    <div class="text-6xl mb-3">${opp.icon}</div>
                    <span class="text-[10px] font-bold bg-slate-800 text-white px-2 py-0.5 rounded mb-1 text-center">LEVEL ${opp.level}</span>
                    <h3 class="text-xl font-black">${opp.name}</h3>
                `;
                btn.addEventListener('click', () => {
                    sound.init();
                    startGame(opp);
                });
                opponentGrid.appendChild(btn);
            });
            lucide.createIcons();
            gameBody.className = "bg-slate-900 text-white min-h-screen overflow-x-hidden flex flex-col justify-between transition-colors duration-500";
        }

        // Start Game
        function startGame(opp) {
            activeOpponent = opp;
            playerHp = 5;
            opponentHp = opp.maxHp;
            lastWordIndex = -1;
            isEffectActive = false;
            comboCount = 0;
            updateComboUI();
            
            oppNameHeader.textContent = `${opp.name} HP`;

            screenTitle.classList.add('hidden');
            screenPlaying.classList.remove('hidden');
            screenResult.classList.add('hidden');
            
            updateHpDisplay();
            nextWord();
        }

        // Update HP UI & Background color based on HP
        function updateHpDisplay() {
            // Player HP effect
            playerHpBar.style.width = `${(playerHp / 5) * 100}%`;
            playerHeartsContainer.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const isFilled = i < Math.floor(playerHp);
                const isPart = i === Math.floor(playerHp) && playerHp % 1 !== 0;
                playerHeartsContainer.innerHTML += `
                    <i data-lucide="heart" class="w-4 h-4 ${isFilled ? 'text-red-500 fill-red-500' : isPart ? 'text-red-400 fill-red-400 opacity-50' : 'text-gray-600'}"></i>
                `;
            }

            // Opponent
            oppHpBar.style.width = `${(opponentHp / activeOpponent.maxHp) * 100}%`;
            oppHeartsContainer.innerHTML = '';
            for (let i = 0; i < activeOpponent.maxHp; i++) {
                const isFilled = i < opponentHp;
                oppHeartsContainer.innerHTML += `
                    <i data-lucide="heart" class="w-4 h-4 ${isFilled ? 'text-purple-500 fill-purple-500' : 'text-gray-600'}"></i>
                `;
            }

            // Background dynamic color
            if (playerHp <= 1) {
                gameBody.classList.replace('bg-slate-900', 'bg-red-950');
            } else {
                gameBody.className = "bg-slate-900 text-white min-h-screen overflow-x-hidden flex flex-col justify-between transition-colors duration-500";
            }

            lucide.createIcons();
        }

        function updateComboUI() {
            if (comboCount > 0) {
                comboContainer.classList.remove('opacity-0');
                comboCountEl.textContent = comboCount;
                comboCountEl.classList.remove('animate-combo');
                void comboCountEl.offsetWidth; // trigger reflow
                comboCountEl.classList.add('animate-combo');
            } else {
                comboContainer.classList.add('opacity-0');
            }
        }

        // Pick and Set Word
        function nextWord() {
            if (playerHp <= 0 || opponentHp <= 0) return;
            
            isEffectActive = false;
            effectRonpa.classList.add('hidden');
            effectTimeout.classList.add('hidden');
            typingBox.className = "bg-slate-950 p-6 md:p-10 rounded-3xl border-4 border-slate-800 transition-all duration-150";

            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * activeOpponent.words.length);
            } while (randomIndex === lastWordIndex && activeOpponent.words.length > 1);
            
            lastWordIndex = randomIndex;
            currentWord = activeOpponent.words[randomIndex];
            typedIndex = 0;
            timeLeft = activeOpponent.timeLimit;
            
            opponentEmoji.textContent = activeOpponent.icon;
            opponentSpeech.textContent = `「${currentWord.trigger}」`;
            replyJapanese.textContent = `反論：『${currentWord.replyText}』`;
            
            renderRomaji();
            startTimer();
        }

        // Render Romaji Character State
        function renderRomaji() {
            replyRomaji.innerHTML = '';
            currentWord.romaji.split('').forEach((char, i) => {
                const span = document.createElement('span');
                span.textContent = char;
                if (i < typedIndex) {
                    span.className = 'text-green-400';
                } else if (i === typedIndex) {
                    span.className = 'text-white border-b-4 border-blue-500 animate-pulse';
                } else {
                    span.className = 'text-slate-600';
                }
                replyRomaji.appendChild(span);
            });
        }

        // Timer Loop
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timeBar.style.width = '100%';
            timeBar.className = "h-full bg-green-400 transition-all duration-100";
            
            timerInterval = setInterval(() => {
                if (isEffectActive) return;
                
                timeLeft -= 100;
                const ratio = timeLeft / activeOpponent.timeLimit;
                timeBar.style.width = `${ratio * 100}%`;
                
                if (ratio < 0.3) {
                    timeBar.className = "h-full bg-red-500 animate-pulse";
                } else {
                    timeBar.className = "h-full bg-green-400";
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 100);
        }

        // Timeout Damage Event
        function handleTimeout() {
            isEffectActive = true;
            effectTimeout.classList.remove('hidden');
            triggerScreenEffects(true, true);
            sound.damage();
            comboCount = 0;
            updateComboUI();
            
            playerHp -= 1.0;
            updateHpDisplay();

            if (playerHp <= 0) {
                setTimeout(() => endGame('lose'), 1200);
            } else {
                setTimeout(nextWord, 1500);
            }
        }

        // Miss Type Handler (Sub-damage 0.2)
        function handleMiss() {
            triggerScreenEffects(false, true);
            sound.miss();
            comboCount = 0;
            updateComboUI();

            typingBox.className = "bg-slate-950 p-6 md:p-10 rounded-3xl border-4 border-red-500 transition-all duration-75 scale-98";
            setTimeout(() => {
                if (!isEffectActive) typingBox.className = "bg-slate-950 p-6 md:p-10 rounded-3xl border-4 border-slate-800 transition-all duration-150";
            }, 150);

            playerHp = Math.max(0, playerHp - 0.2);
            updateHpDisplay();

            if (playerHp <= 0) {
                if (timerInterval) clearInterval(timerInterval);
                endGame('lose');
            }
        }

        // Successful Sentence Completion
        function handleWordComplete() {
            if (timerInterval) clearInterval(timerInterval);
            isEffectActive = true;
            effectRonpa.classList.remove('hidden');
            sound.correct();

            opponentHp -= 1;
            updateHpDisplay();

            if (opponentHp <= 0) {
                setTimeout(() => endGame('win'), 1000);
            } else {
                setTimeout(nextWord, 1000);
            }
        }

        // Flash and Shake Utilities
        function triggerScreenEffects(shake, flash) {
            if (shake) {
                screenPlaying.classList.add('animate-shake');
                setTimeout(() => screenPlaying.classList.remove('animate-shake'), 400);
            }
            if (flash) {
                flashOverlay.classList.add('animate-flash-red');
                setTimeout(() => flashOverlay.classList.remove('animate-flash-red'), 200);
            }
        }

        // End Game state
        function endGame(result) {
            if (timerInterval) clearInterval(timerInterval);
            
            screenPlaying.classList.add('hidden');
            screenResult.classList.remove('hidden');

            resultIconContainer.innerHTML = '';
            if (result === 'win') {
                sound.win();
                resultText.textContent = 'VICTORY';
                resultIconContainer.innerHTML = '<i data-lucide="trophy" class="w-20 h-20 text-yellow-400"></i>';
                screenResult.className = 'flex-grow flex items-center justify-center p-4 bg-yellow-500/20';
            } else {
                sound.lose();
                resultText.textContent = 'DEFEATED';
                resultIconContainer.innerHTML = '<i data-lucide="skull" class="w-20 h-20 text-red-500"></i>';
                screenResult.className = 'flex-grow flex items-center justify-center p-4 bg-slate-950';
            }
            lucide.createIcons();
        }

        // Key Down Hook
        window.addEventListener('keydown', (e) => {
            if (screenPlaying.classList.contains('hidden') || isEffectActive || !currentWord) return;
            if (e.key.length !== 1) return;

            handleInput(e.key.toLowerCase());
        });

        // Restart Trigger
        btnRestart.addEventListener('click', () => {
            screenResult.classList.add('hidden');
            screenTitle.classList.remove('hidden');
            initTitleScreen();
        });

        // Initialize App onLoad
        window.onload = function() {
            initTitleScreen();
        }
    </script>
</body>
</html>
